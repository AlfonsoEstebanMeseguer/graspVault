# Signed Android App Bundle of Speaking P2P for Google Play (D-068).
#
# Manual only: Actions -> "speaking-p2p Google Play" -> Run workflow, or
#   gh workflow run speaking-p2p-play.yml --ref <branch> [-f track=internal -f status=completed]
#
# Always keeps the signed .aab as an artifact (7 days): the very first upload to Play Console has
# to be done by hand. Once PLAY_SERVICE_ACCOUNT_JSON exists it also uploads to the chosen track.
#
# Repository secrets (setup in speaking-p2p/docs/ANDROID_PLAY_SETUP.md). None is ever printed:
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks, alias "upload")
#   ANDROID_KEYSTORE_PASSWORD  its password (store and key share it)
#   PLAY_SERVICE_ACCOUNT_JSON  optional: Google Cloud service account key with access in Play Console
name: speaking-p2p Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (needs PLAY_SERVICE_ACCOUNT_JSON; otherwise only the artifact)"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "draft while the app was never published; completed rolls it out"
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  group: speaking-p2p-play
  cancel-in-progress: false

defaults:
  run:
    working-directory: speaking-p2p/apps/mobile

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the upload keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD"; exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Backend config (secret MOBILE_DEFINES if set, else env/dev.json)
        env:
          MOBILE_DEFINES: ${{ secrets.MOBILE_DEFINES }}
        run: |
          if [ -n "$MOBILE_DEFINES" ]; then printf '%s\n' "$MOBILE_DEFINES" > env/dev.json; fi
          python3 -c "import json;d=json.load(open('env/dev.json'));print('keys:', sorted(d))"
      # versionCode = run number: Play needs it to grow, and only this workflow uploads.
      # Obfuscated with split Dart symbols, as on iOS (D-064).
      - name: flutter build appbundle (signed)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter pub get
          flutter build appbundle --release --dart-define-from-file=env/dev.json \
            --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=GIT_COMMIT=${GITHUB_SHA::7} \
            --obfuscate --split-debug-info=build/debug-info \
            --extra-gen-snapshot-options=--save-obfuscation-map=build/debug-info/obfuscation.map.json
          AAB=build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB" | grep -q "CN=MirloTalk Upload" \
            || { echo "::error::The bundle is not signed with the upload key"; exit 1; }
          ls -lh "$AAB"
      - name: Upload debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_DIST: ${{ github.run_number }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::warning::Sentry symbols not uploaded: set the SENTRY_AUTH_TOKEN secret and the SENTRY_ORG / SENTRY_PROJECT variables"
            exit 0
          fi
          dart run sentry_dart_plugin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MirloTalk-${{ github.run_number }}-aab
          path: speaking-p2p/apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
      - name: Upload to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set: download the .aab artifact and upload it in Play Console"
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "google-api-python-client>=2.100,<3" "google-auth>=2.20,<3"
          "$RUNNER_TEMP/venv/bin/python" tool/play_upload.py build/app/outputs/bundle/release/app-release.aab "${{ inputs.track }}" "${{ inputs.status }}"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
