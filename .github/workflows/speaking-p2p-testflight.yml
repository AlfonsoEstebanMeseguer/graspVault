# Signed iOS build of Speaking P2P uploaded to TestFlight, without a Mac (D-062). Sign in with Apple
# only works in a build signed by the paid account, so this is the way to test it on the iPhone.
# The unsigned workflow (speaking-p2p-ios.yml) stays for quick Sideloadly builds.
#
# Manual only: Actions -> "speaking-p2p TestFlight" -> Run workflow, or
#   gh workflow run speaking-p2p-testflight.yml --ref <branch>
#
# Repository secrets (setup in speaking-p2p/docs/AUTH_OAUTH_SETUP.md, section 2.4). None is ever printed:
#   IOS_DIST_CERT_P12       base64 of the Apple Distribution certificate + key (.p12)
#   IOS_DIST_CERT_PASSWORD  password of that .p12
#   IOS_APPSTORE_PROFILE    base64 of the App Store provisioning profile (.mobileprovision)
#   ASC_KEY_ID              App Store Connect API key ID
#   ASC_ISSUER_ID           App Store Connect issuer ID
#   ASC_KEY_P8              contents of AuthKey_<ASC_KEY_ID>.p8
# Team ID, profile name and bundle ID are read from the profile itself.
name: speaking-p2p TestFlight

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS machine. If macos-latest (ARM) stays queued and GitHub cancels it for capacity, use Intel"
        type: choice
        options: [macos-latest, macos-15-intel]
        default: macos-latest

concurrency:
  group: speaking-p2p-testflight
  cancel-in-progress: false

defaults:
  run:
    working-directory: speaking-p2p/apps/mobile

jobs:
  testflight:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the secrets
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for v in P12 P12_PASSWORD PROFILE ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing (see AUTH_OAUTH_SETUP.md 2.4)"; exit 1; fi
      - name: Select the newest Xcode
        working-directory: .
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      # Temporary keychain with the distribution identity, and the profile where Xcode looks for it.
      - name: Install the signing identity and profile
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -hex 24)
          echo "::add-mask::$KC_PASS"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          curl -fsSL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KC" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Distribution" \
            || { echo "::error::No 'Apple Distribution' identity in the .p12"; exit 1; }

          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PB=/usr/libexec/PlistBuddy
          UUID=$($PB -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$($PB -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          TEAM=$($PB -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          APPID=$($PB -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          BUNDLE="${APPID#"$TEAM".}"
          echo "Profile: '$NAME' for $BUNDLE (team $TEAM)"
          [ "$BUNDLE" = "com.speakingp2p.speakingP2p" ] || { echo "::error::Profile is for $BUNDLE"; exit 1; }
          $PB -c 'Print Entitlements:com.apple.developer.applesignin' "$RUNNER_TEMP/profile.plist" > /dev/null 2>&1 \
            || { echo "::error::The profile lacks Sign In with Apple: enable it on the App ID and regenerate the profile"; exit 1; }
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/app.mobileprovision" "$d/$UUID.mobileprovision"
          done

          # Runner target only (Pods keep their own config): read by Release.xcconfig via #include?.
          cat > ios/Flutter/Signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $NAME
          EOF

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE</key><string>$NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Backend config (secret MOBILE_DEFINES if set, else env/dev.json)
        env:
          MOBILE_DEFINES: ${{ secrets.MOBILE_DEFINES }}
        run: |
          if [ -n "$MOBILE_DEFINES" ]; then printf '%s\n' "$MOBILE_DEFINES" > env/dev.json; fi
          python3 -c "import json;d=json.load(open('env/dev.json'));print('keys:', sorted(d))"
      - name: Check the plists
        run: plutil -lint ios/Runner/Info.plist ios/Runner/Runner.entitlements
      - name: Google Sign-In URL scheme
        run: |
          flutter pub get
          dart run tool/ios_auth_config.dart env/dev.json
      # The run number is the iOS build number: TestFlight needs it to grow, and only this
      # workflow uploads. Obfuscated with split Dart symbols, as in the unsigned build (D-064).
      - name: flutter build ipa (signed)
        run: |
          flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define-from-file=env/dev.json --build-number=${{ github.run_number }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} --dart-define=GIT_COMMIT=${GITHUB_SHA::7} \
            --obfuscate --split-debug-info=build/debug-info \
            --extra-gen-snapshot-options=--save-obfuscation-map=build/debug-info/obfuscation.map.json
          ls -lh build/ios/ipa/
      - name: Upload debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_DIST: ${{ github.run_number }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::warning::Sentry symbols not uploaded: set the SENTRY_AUTH_TOKEN secret and the SENTRY_ORG / SENTRY_PROJECT variables"
            exit 0
          fi
          dart run sentry_dart_plugin
      # altool finds the key as ~/.appstoreconnect/private_keys/AuthKey_<id>.p8.
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. TestFlight shows it after Apple finishes processing (5-30 min)."
      - name: Remove the keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/profile.plist" ios/Flutter/Signing.xcconfig
