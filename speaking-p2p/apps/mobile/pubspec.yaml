name: speaking_p2p
description: "Speaking P2P: Cambridge Speaking exam simulator between students."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audio_session: ^0.2.4
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_image_compress: 2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  google_sign_in: ^7.2.0
  image_picker: 1.2.3
  intl: ^0.20.3
  just_audio: ^0.10.6
  livekit_client: ^2.13.1
  posthog_flutter: ^5.61.1
  sentry_flutter: ^10.5.0
  shared_preferences: ^2.5.6
  sign_in_with_apple: ^8.2.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  sentry_dart_plugin: ^3.6.0

flutter:
  uses-material-design: true
  generate: true
  # Design 2.0 (docs/img/img_remaked): OFL fonts, bundled so the exam never
  # waits for a download. Licences in assets/fonts/OFL-*.txt and LICENSE-phosphor.txt.
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-400.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-500.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-600.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-700.ttf
          weight: 700
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-500.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-500Italic.ttf
          weight: 500
          style: italic
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-600.ttf
          weight: 600
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-500.ttf
          weight: 500
        - asset: assets/fonts/Caveat-600.ttf
          weight: 600
  # Copied from /content by scripts/content/sync-app.ts (CI checks it is fresh).
  # Binaries (reader audio, photos) are NOT bundled: they come from R2/CDN.
  assets:
    - assets/content/
    - assets/content/exams/B1/
    - assets/content/exams/B2/
    - assets/content/exams/C1/
    - assets/content/diagrams/
    - assets/legal/
    - assets/sounds/
    - assets/fonts/OFL-instrumentsans.txt
    - assets/fonts/OFL-newsreader.txt
    - assets/fonts/OFL-ibmplexmono.txt
    - assets/fonts/OFL-caveat.txt
    - assets/fonts/LICENSE-phosphor.txt

# Readable stack traces in Sentry for release builds (D-064, docs/OBSERVABILITY.md).
# `dart run sentry_dart_plugin` after a release build uploads the native debug files
# (dSYM / .so) and the Dart symbols. org, project and token come from SENTRY_ORG,
# SENTRY_PROJECT and SENTRY_AUTH_TOKEN (CI secrets), never from this file.
sentry:
  upload_debug_symbols: true
  upload_sources: false # never ship our source code to Sentry
  upload_source_maps: false # web only
  symbols_path: build/debug-info
  dart_symbol_map_path: build/debug-info/obfuscation.map.json
  commits: false # no repository integration in Sentry
  ignore_missing: true
