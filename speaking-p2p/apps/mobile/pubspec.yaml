name: speaking_p2p
description: "Speaking P2P: Cambridge Speaking exam simulator between students."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # Copied from /content by scripts/content/sync-app.ts (CI checks it is fresh).
  # Binaries (reader audio, photos) are NOT bundled: they come from R2/CDN.
  assets:
    - assets/content/
    - assets/content/exams/B1/
    - assets/content/exams/B2/
    - assets/content/exams/C1/
    - assets/content/diagrams/
